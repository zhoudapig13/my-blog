backend:
  name: github
  repo: zhoudapig13/my-blog
  branch: main

local_backend: true

media_folder: "resources/uploads"
public_folder: "resources/uploads"

locale: "zh_Hans"

collections:
  - name: "posts"
    label: "博客文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "分类", name: "category", widget: "string", default: "未分类" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "PDF 链接", name: "pdf", widget: "string", required: false }
      - { label: "PDF 显示名称", name: "pdfTitle", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "diary"
    label: "日记"
    folder: "content/diary"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "分类", name: "category", widget: "string", default: "日常" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "PDF 链接", name: "pdf", widget: "string", required: false }
      - { label: "PDF 显示名称", name: "pdfTitle", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "site_data"
    label: "站点数据"
    files:
      - name: "profile"
        label: "个人介绍"
        file: "data/profile.json"
        fields:
          - { label: "名字", name: "name", widget: "string" }
          - { label: "简介", name: "bio", widget: "text" }
          - { label: "照片", name: "photo", widget: "image", required: false }

      - name: "resources"
        label: "专题资源库"
        file: "data/resources.json"
        fields:
          - label: "专题栏目"
            name: "collections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "栏目名称", name: "title", widget: "string", hint: "例如：Tabular Foundation Models" }
              - { label: "栏目短链接", name: "slug", widget: "string", required: false, hint: "使用英文小写和短横线，例如：tabular-foundation-models" }
              - { label: "栏目简介", name: "description", widget: "text", required: false }
              - { label: "Markdown 导读与论文清单", name: "content", widget: "markdown", required: false, hint: "可添加标题、段落、论文超链接、学习路线与备注。" }
              - label: "文件与链接"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.type}} · {{fields.title}}"
                fields:
                  - { label: "资源名称", name: "title", widget: "string" }
                  - { label: "类型", name: "type", widget: "select", options: ["PDF", "PPT", "代码", "数据集", "网页", "视频", "其他"] }
                  - { label: "链接或文件路径", name: "url", widget: "string", required: false, hint: "支持 resources/ 下的本地文件路径或 https:// 外部链接。" }
                  - { label: "预览地址", name: "previewUrl", widget: "string", required: false, hint: "PDF 可直接填写自身路径；PPT 可填写对应的 PDF 预览版路径。" }
                  - { label: "一句话说明", name: "description", widget: "text", required: false }

      - name: "friends"
        label: "友链"
        file: "data/friends.json"
        fields:
          - label: "友链列表"
            name: "items"
            widget: "list"
            fields:
              - { label: "头像", name: "avatar", widget: "image", required: false }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "副标题", name: "subtitle", widget: "text", required: false }
              - { label: "链接", name: "url", widget: "string" }

      - name: "plans"
        label: "计划"
        file: "data/plans.json"
        fields:
          - label: "计划列表"
            name: "items"
            widget: "list"
            fields:
              - { label: "目标", name: "goal", widget: "string" }
              - { label: "状态", name: "status", widget: "select", options: [{ label: "未开始", value: "todo" }, { label: "进行中", value: "doing" }, { label: "已完成", value: "done" }] }
